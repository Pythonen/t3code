<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
      }
      svg {
        display: block;
      }
    </style>
  </head>
  <body>
    <svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- macOS icon grid: 824px squircle inset 100px -->
        <clipPath id="tile">
          <rect x="100" y="100" width="824" height="824" rx="186" ry="186" />
        </clipPath>

        <linearGradient id="sky" x1="0" y1="0" x2="0.35" y2="1">
          <stop offset="0" stop-color="#070b24" />
          <stop offset="0.45" stop-color="#151244" />
          <stop offset="0.8" stop-color="#2a1561" />
          <stop offset="1" stop-color="#3b1462" />
        </linearGradient>

        <radialGradient id="halo" cx="0.5" cy="0.47" r="0.42">
          <stop offset="0" stop-color="#7c6bff" stop-opacity="0.55" />
          <stop offset="0.55" stop-color="#5b3fd6" stop-opacity="0.18" />
          <stop offset="1" stop-color="#5b3fd6" stop-opacity="0" />
        </radialGradient>

        <linearGradient id="flux1" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#29e3ff" stop-opacity="0" />
          <stop offset="0.25" stop-color="#29e3ff" />
          <stop offset="0.6" stop-color="#8b5cf6" />
          <stop offset="1" stop-color="#ff4fb3" stop-opacity="0.9" />
        </linearGradient>
        <linearGradient id="flux2" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#ff4fb3" stop-opacity="0.85" />
          <stop offset="0.5" stop-color="#7c5cff" />
          <stop offset="1" stop-color="#29e3ff" stop-opacity="0" />
        </linearGradient>

        <linearGradient id="letters" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffffff" />
          <stop offset="0.6" stop-color="#f1efff" />
          <stop offset="1" stop-color="#d9d2ff" />
        </linearGradient>

        <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffffff" stop-opacity="0.16" />
          <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.03" />
          <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
        </linearGradient>

        <filter id="blurWide" x="-20%" y="-50%" width="140%" height="200%">
          <feGaussianBlur stdDeviation="22" />
        </filter>
        <filter id="blurSoft" x="-20%" y="-50%" width="140%" height="200%">
          <feGaussianBlur stdDeviation="5" />
        </filter>
        <filter id="letterGlow" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow
            dx="0"
            dy="0"
            stdDeviation="18"
            flood-color="#9d8cff"
            flood-opacity="0.75"
          />
          <feDropShadow
            dx="0"
            dy="10"
            stdDeviation="10"
            flood-color="#0a0626"
            flood-opacity="0.6"
          />
        </filter>
        <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow
            dx="0"
            dy="14"
            stdDeviation="18"
            flood-color="#000000"
            flood-opacity="0.45"
          />
        </filter>
      </defs>

      <!-- tile with shadow -->
      <rect
        x="100"
        y="100"
        width="824"
        height="824"
        rx="186"
        ry="186"
        fill="url(#sky)"
        filter="url(#tileShadow)"
      />

      <g clip-path="url(#tile)">
        <rect x="100" y="100" width="824" height="824" fill="url(#sky)" />
        <rect x="100" y="100" width="824" height="824" fill="url(#halo)" />

        <!-- stars -->
        <g fill="#ffffff">
          <circle cx="232" cy="214" r="5" opacity="0.9" />
          <circle cx="418" cy="176" r="3.5" opacity="0.7" />
          <circle cx="786" cy="236" r="4.5" opacity="0.85" />
          <circle cx="858" cy="402" r="3" opacity="0.6" />
          <circle cx="176" cy="470" r="3" opacity="0.6" />
          <circle cx="640" cy="168" r="3" opacity="0.55" />
        </g>
        <g stroke="#cfc8ff" stroke-width="3.5" stroke-linecap="round" opacity="0.85">
          <path d="M304 272 v26 M291 285 h26" />
          <path d="M178 372 v20 M168 382 h20" />
        </g>

        <!-- flux aurora: wide blurred glow, then crisp ribbons -->
        <g filter="url(#blurWide)" opacity="0.9">
          <path
            d="M60 780 C 260 640, 420 860, 620 720 S 900 600, 1000 660 L 1000 1000 L 60 1000 Z"
            fill="url(#flux1)"
            opacity="0.55"
          />
          <path
            d="M40 880 C 240 760, 460 960, 680 830 S 920 760, 1010 800 L 1010 1010 L 40 1010 Z"
            fill="url(#flux2)"
            opacity="0.5"
          />
        </g>
        <g fill="none" stroke-linecap="round">
          <path
            d="M70 770 C 270 630, 430 850, 630 712 S 910 590, 1010 650"
            stroke="url(#flux1)"
            stroke-width="10"
            filter="url(#blurSoft)"
            opacity="0.95"
          />
          <path
            d="M70 770 C 270 630, 430 850, 630 712 S 910 590, 1010 650"
            stroke="#e9fbff"
            stroke-width="2.5"
            opacity="0.7"
          />
          <path
            d="M50 852 C 250 738, 470 930, 690 808 S 930 740, 1010 780"
            stroke="url(#flux2)"
            stroke-width="8"
            filter="url(#blurSoft)"
            opacity="0.9"
          />
          <path
            d="M90 930 C 300 836, 500 990, 720 892 S 940 850, 1010 880"
            stroke="url(#flux1)"
            stroke-width="5"
            opacity="0.55"
          />
        </g>

        <!-- letters -->
        <text
          x="512"
          y="598"
          text-anchor="middle"
          font-family="'Avenir Next', 'SF Pro Rounded', 'Helvetica Neue', sans-serif"
          font-weight="800"
          font-size="372"
          letter-spacing="-6"
          fill="url(#letters)"
          filter="url(#letterGlow)"
        >
          AP
        </text>

        <!-- glass sheen -->
        <rect x="100" y="100" width="824" height="420" fill="url(#gloss)" />
      </g>

      <!-- rim light -->
      <rect
        x="101.5"
        y="101.5"
        width="821"
        height="821"
        rx="185"
        ry="185"
        fill="none"
        stroke="#ffffff"
        stroke-opacity="0.14"
        stroke-width="3"
      />
    </svg>
  </body>
</html>
